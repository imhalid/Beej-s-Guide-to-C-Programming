server {
  listen 80;
  server_name _;

  # Performance & Cold-Start Connection Stabilization (Fix 504 Gateway Timeout)
  sendfile on;
  tcp_nopush on;
  tcp_nodelay on;
  keepalive_timeout 65s;
  keepalive_requests 10000;
  reset_timedout_connection on;
  client_body_timeout 60s;
  client_header_timeout 60s;
  send_timeout 60s;

  gzip on;
  gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;
  gzip_min_length 1000;

  root /usr/share/nginx/html;
  index html/index.html index.html;

  location = / {
    try_files /html/index.html =404;
  }

  location / {
    try_files $uri $uri/ /html/$uri /html/index.html;
  }

  location ~* \.(?:css|js|mjs|woff2?|ttf|otf|png|jpg|jpeg|gif|svg|ico|html)$ {
    expires 1y;
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri /html/$uri =404;
  }
}
